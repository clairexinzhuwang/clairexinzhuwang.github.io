<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-labelledby="title desc">
<title id="title">Simultaneous coverage across simulation settings</title>
<desc id="desc">Each of twenty dots represents one setting's observed proportion of simulations in which all prespecified coefficient intervals contained their population targets. Coverage ranges from 92% to 100%. Horizontal position is coverage; vertical stacking only separates coincident dots. The dashed line marks the nominal 95% joint level. These dots are observed rates, not confidence intervals; Monte Carlo uncertainty is not shown.</desc>
<rect width="480" height="250" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243039">
  <text x="240" y="30" text-anchor="middle" fill="#53616b">95% nominal</text>
  <line class="coverage-reference" data-coverage="0.95" x1="240" x2="240" y1="48" y2="174" stroke="#7c868e" stroke-width="1.3" stroke-dasharray="4 5"/>
  <circle class="coverage-dot" data-coverage="0.92" cx="124.8" cy="147" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.92" cx="124.8" cy="126" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.93" cx="163.2" cy="147" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.93" cx="163.2" cy="126" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.93" cx="163.2" cy="105" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.93" cx="163.2" cy="84" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.94" cx="201.6" cy="147" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.94" cx="201.6" cy="126" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.94" cx="201.6" cy="105" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.96" cx="278.4" cy="147" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.96" cx="278.4" cy="126" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.96" cx="278.4" cy="105" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.96" cx="278.4" cy="84" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.97" cx="316.8" cy="147" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.98" cx="355.2" cy="147" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.98" cx="355.2" cy="126" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.98" cx="355.2" cy="105" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="0.99" cx="393.6" cy="147" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="1" cx="432.0" cy="147" r="5.5" fill="#315f75"/>
  <circle class="coverage-dot" data-coverage="1" cx="432.0" cy="126" r="5.5" fill="#315f75"/>
  <line x1="48" x2="432" y1="174" y2="174" stroke="#aeb7bd"/>
  <line x1="48" x2="48" y1="174" y2="180" stroke="#aeb7bd"/>
  <line x1="240" x2="240" y1="174" y2="180" stroke="#aeb7bd"/>
  <line x1="432" x2="432" y1="174" y2="180" stroke="#aeb7bd"/>
  <text x="48" y="202" text-anchor="middle">90%</text>
  <text x="240" y="202" text-anchor="middle">95%</text>
  <text x="432" y="202" text-anchor="middle">100%</text>
  <text x="240" y="236" text-anchor="middle">Simultaneous coverage</text>
</g>
</svg>
