<svg xmlns="http://www.w3.org/2000/svg" width="320" height="245" viewBox="0 0 320 245" role="img" aria-labelledby="coverage-title coverage-desc">
  <title id="coverage-title">Marginal coverage across sample sizes</title>
  <desc id="coverage-desc">V51 Figure 1 coordinate-mean marginal coverage of nominal 95 percent parameter intervals, with replacement and batch size B equals 10. At sample sizes ten thousand, one hundred thousand, and one million, rank regression has coverage 96.1, 95.7, and 95.45 percent; bipartite ranking has 95.2, 94.83333333333333, and 95.3 percent; metric learning has 95.1, 95.23, and 95.09 percent. The sample-size axis is logarithmic. The dashed line marks nominal 95 percent coverage. Pointwise Monte Carlo uncertainty bars are omitted for readability; this chart shows coverage estimates, not parameter interval endpoints.</desc>
  <rect width="320" height="245" fill="#fff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#263039">
    <text x="5" y="20" font-weight="600">Marginal coverage</text>
    <text x="315" y="20" text-anchor="end">B = 10</text>
    <line x1="59" y1="137.000" x2="301" y2="137.000" stroke="#E5E8EA" stroke-width="1"/>
    <text x="49" y="143.000" text-anchor="end">94%</text>
    <line x1="59" y1="102.667" x2="301" y2="102.667" stroke="#75818A" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="49" y="108.667" text-anchor="end">95%</text>
    <line x1="59" y1="68.333" x2="301" y2="68.333" stroke="#E5E8EA" stroke-width="1"/>
    <text x="49" y="74.333" text-anchor="end">96%</text>
    <line x1="59" y1="34.000" x2="301" y2="34.000" stroke="#E5E8EA" stroke-width="1"/>
    <text x="49" y="40.000" text-anchor="end">97%</text>
    <text x="301" y="132" text-anchor="end" fill="#626F79">Nominal 95%</text>
    <polyline points="64.00,64.900 176.00,78.633 288.00,87.217" fill="none" stroke="#527997" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64.00" cy="64.90" r="4.2" fill="#527997" stroke="#fff" stroke-width="1.2"/>
    <circle cx="176.00" cy="78.63" r="4.2" fill="#527997" stroke="#fff" stroke-width="1.2"/>
    <circle cx="288.00" cy="87.22" r="4.2" fill="#527997" stroke="#fff" stroke-width="1.2"/>
    <polyline points="64.00,95.800 176.00,108.389 288.00,92.367" fill="none" stroke="#987055" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="59.80" y="91.60" width="8.4" height="8.4" rx="0.5" fill="#987055" stroke="#fff" stroke-width="1.2"/>
    <rect x="171.80" y="104.19" width="8.4" height="8.4" rx="0.5" fill="#987055" stroke="#fff" stroke-width="1.2"/>
    <rect x="283.80" y="88.17" width="8.4" height="8.4" rx="0.5" fill="#987055" stroke="#fff" stroke-width="1.2"/>
    <polyline points="64.00,99.233 176.00,94.770 288.00,99.577" fill="none" stroke="#4E817D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 64.00,94.03 L 69.20,103.43 L 58.80,103.43 Z" fill="#4E817D" stroke="#fff" stroke-width="1.2"/>
    <path d="M 176.00,89.57 L 181.20,98.97 L 170.80,98.97 Z" fill="#4E817D" stroke="#fff" stroke-width="1.2"/>
    <path d="M 288.00,94.38 L 293.20,103.78 L 282.80,103.78 Z" fill="#4E817D" stroke="#fff" stroke-width="1.2"/>
    <line x1="64" y1="137" x2="64" y2="142" stroke="#9BA4AB" stroke-width="1"/>
    <text x="64" y="162" text-anchor="middle">10⁴</text>
    <line x1="176" y1="137" x2="176" y2="142" stroke="#9BA4AB" stroke-width="1"/>
    <text x="176" y="162" text-anchor="middle">10⁵</text>
    <line x1="288" y1="137" x2="288" y2="142" stroke="#9BA4AB" stroke-width="1"/>
    <text x="288" y="162" text-anchor="middle">10⁶</text>
