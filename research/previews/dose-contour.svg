<title id="bo-title">Synthetic dose-finding contour preview</title><desc id="bo-desc">The website's starting teaching data, not patient or manuscript results. Shading shows predicted mean efficacy in illustrative units across standardized drug A and B doses. The dashed contour marks an 80 percent posterior probability that mean toxicity is below 0.60. Open circles are the 25 candidate dose combinations. The map does not show an individual patient's adverse-event risk.</desc>
