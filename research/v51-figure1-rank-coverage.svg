<title id="title">Rank regression: Marginal coverage</title>
<desc id="desc">V51 Figure 1 under with-replacement sampling. Each setting has 1,000 replications. Small dots show all 2 coefficients; large markers show equal-weight coordinate means. Sample sizes are 10,000, 100,000 and 1,000,000, on a logarithmic axis; batch sizes are 1, 10 and 100. Bars are analytic pointwise 95% Monte Carlo intervals for the coordinate means, retaining dependence within each replication.</desc>
