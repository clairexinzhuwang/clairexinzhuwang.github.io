[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ranking-reliability-lab"
version = "0.1.0"
description = "A reproducible MovieLens benchmark for BPR training-budget trade-offs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
license = { text = "MIT" }

[project.scripts]
ranking-reliability-lab = "ranking_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

